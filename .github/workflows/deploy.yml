name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: Build DLL (windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Windows MSVC cross-compile tools
        run: |
          sudo apt install -y llvm lld
          sudo ln -sf /usr/bin/llvm-ar /usr/local/bin/llvm-lib

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ env.TARGET }}

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Cache cargo-xwin MSVC CRT & Windows SDK
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: ${{ runner.os }}-xwin-cache-v1

      - name: Build release DLL
        run: |
          mkdir -p build
          cargo xwin build --target "$TARGET" --release --locked
          cp "target/$TARGET/release/honse_pov.dll" build/

      - name: Write checksum
        run: |
          cd build
          sha256sum honse_pov.dll > honse_pov.dll.sha256

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            build/honse_pov.dll
            build/honse_pov.dll.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: honse_pov-windows
          path: build/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/honse_pov-windows/*
          generate_release_notes: true
