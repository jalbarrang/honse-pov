[package]
name = "honse_pov"
version = "0.1.0"
edition = "2021"
description = "Hachimi Edge plugin: experimental race POV camera (milestone 1: runner selection)"
license = "GPL-3.0-or-later"

[lib]
name = "honse_pov"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1

[profile.dev]
debug = "limited"

[dependencies]
# The plugin talks to Hachimi only through the C ABI exposed by hachimi_init_v3.
# honse-hotkeys is the one shared crate: chord parsing, edge triggering and the
# foreground gate, kept out of this repo so honse-tracker can use it too.
honse-hotkeys = { git = "https://github.com/jalbarrang/honse-hotkeys" }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
